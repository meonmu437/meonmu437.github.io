name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  discussion:
    types: [created, edited, category_changed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'discussion' || github.event.discussion.user.login == github.repository_owner
    permissions:
      contents: write
      discussions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Save owner Discussions as Markdown
        if: github.event_name == 'discussion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix apps/jamdam
          node apps/jamdam/sync-discussions.mjs
          git add -- apps/jamdam/content/posts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync owner Discussions to board posts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # GITHUB_TOKEN commits do not trigger another push workflow.
      # Build and deploy the synchronized files within this same run.
      - name: Build all sites
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
