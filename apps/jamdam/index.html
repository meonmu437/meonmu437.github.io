<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>잡담 — meonmu437</title>
<style>
	:root {
		--bg: #0b0d10;
		--window: #12151a;
		--titlebar: #1a1e24;
		--border: #262b33;
		--text: #d7dae0;
		--muted: #7d8590;
		--user: #5fd76d;
		--path: #5b9dfa;
		--dot-red: #ff5f57;
		--dot-yellow: #febc2e;
		--dot-green: #28c840;
	}

	* {
		box-sizing: border-box;
	}

	html,
	body {
		margin: 0;
		padding: 0;
	}

	body {
		min-height: 100vh;
		background: var(--bg);
		padding: 2rem 1.25rem 4rem;
		font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
		display: flex;
		justify-content: center;
	}

	.terminal {
		width: 100%;
		max-width: 40rem;
		border-radius: 0.75rem;
		border: 1px solid var(--border);
		background: var(--window);
		box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.35);
		overflow: hidden;
	}

	.titlebar {
		display: flex;
		align-items: center;
		gap: 0.6rem;
		padding: 0.65rem 0.9rem;
		background: var(--titlebar);
		border-bottom: 1px solid var(--border);
	}

	.dots {
		display: flex;
		gap: 0.45rem;
	}

	.dot {
		width: 0.7rem;
		height: 0.7rem;
		border-radius: 50%;
	}

	.dot.red {
		background: var(--dot-red);
	}
	.dot.yellow {
		background: var(--dot-yellow);
	}
	.dot.green {
		background: var(--dot-green);
	}

	.titlebar-label {
		flex: 1;
		text-align: center;
		font-size: 0.78rem;
		color: var(--muted);
		margin-inline-end: 2.5rem;
	}

	.screen {
		padding: 1.5rem 1.25rem 2rem;
		font-size: 0.9rem;
		line-height: 1.7;
		color: var(--text);
	}

	.line {
		word-break: break-word;
	}

	.prompt .user {
		color: var(--user);
		font-weight: 600;
	}

	.prompt .sep {
		color: var(--muted);
	}

	.prompt .path {
		color: var(--path);
		font-weight: 600;
	}

	.toolbar {
		display: flex;
		align-items: center;
		justify-content: space-between;
		margin-top: 1.1rem;
	}

	.back-link,
	.new-post-link {
		display: inline-flex;
		align-items: center;
		gap: 0.35rem;
		color: var(--muted);
		text-decoration: none;
		font-size: 0.82rem;
	}

	.new-post-link {
		color: var(--path);
		font-weight: 600;
	}

	.back-link:hover,
	.new-post-link:hover {
		text-decoration: underline;
	}

	.category-tabs {
		display: flex;
		flex-wrap: wrap;
		gap: 0.4rem;
		margin-top: 1.1rem;
	}

	.category-tab {
		display: inline-flex;
		align-items: center;
		gap: 0.3rem;
		padding: 0.3rem 0.7rem;
		border-radius: 999px;
		border: 1px solid var(--border);
		background: transparent;
		color: var(--muted);
		font-family: inherit;
		font-size: 0.78rem;
		cursor: pointer;
	}

	.category-tab:hover {
		border-color: var(--path);
		color: var(--text);
	}

	.category-tab.is-active {
		border-color: var(--path);
		background: color-mix(in srgb, var(--path) 16%, transparent);
		color: var(--text);
		font-weight: 600;
	}

	.post-category {
		color: var(--path);
	}

	#post-list {
		margin-top: 1rem;
		display: flex;
		flex-direction: column;
		gap: 0.15rem;
	}

	.post-row {
		display: block;
		padding: 0.7rem 0.15rem;
		border-bottom: 1px dashed var(--border);
		text-decoration: none;
		color: var(--text);
	}

	.post-row:first-child {
		border-top: 1px dashed var(--border);
	}

	.post-title {
		display: block;
		font-weight: 600;
	}

	.post-row:hover .post-title {
		color: var(--path);
		text-decoration: underline;
	}

	.post-meta {
		display: block;
		margin-top: 0.2rem;
		font-size: 0.78rem;
		color: var(--muted);
	}

	.post-row.is-pinned {
		background: color-mix(in srgb, var(--path) 7%, transparent);
	}

	.pin-icon {
		margin-inline-end: 0.3rem;
	}

	.state-msg {
		margin-top: 1.4rem;
		color: var(--muted);
		font-size: 0.85rem;
	}

	.pagination {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 0.9rem;
		margin-top: 1.3rem;
	}

	.page-btn {
		border: 1px solid var(--border);
		background: transparent;
		color: var(--text);
		font-family: inherit;
		font-size: 0.82rem;
		padding: 0.3rem 0.7rem;
		border-radius: 0.4rem;
		cursor: pointer;
	}

	.page-btn:hover:not(:disabled) {
		border-color: var(--path);
		color: var(--path);
	}

	.page-btn:disabled {
		opacity: 0.35;
		cursor: default;
	}

	.page-status {
		font-size: 0.8rem;
		color: var(--muted);
	}
</style>
<link rel="stylesheet" href="diary.css" />
</head>
<body>
	<div class="terminal">
		<span class="diary-sticker diary-sticker--dog" aria-hidden="true">🐶</span>
		<span class="diary-sticker diary-sticker--alien" aria-hidden="true">👾</span>
		<div class="titlebar">
			<div class="dots">
				<span class="dot red"></span>
				<span class="dot yellow"></span>
				<span class="dot green"></span>
			</div>
			<div class="titlebar-label">잡담 노트</div>
		</div>
		<div class="screen">
			<div class="line prompt">
				오늘 떠오른 이야기와 메모를 모아 두는 페이지. ✎
			</div>
			<div class="toolbar">
				<a href="../" class="back-link">&larr; 대문으로 돌아가기</a>
				<a
					href="https://github.com/meonmu437/meonmu437.github.io/discussions/new?category=%EC%9E%A1%EB%8B%B4"
					id="new-post-link"
					class="new-post-link"
					target="_blank"
					rel="noopener noreferrer"
				>
					+ 새 글 쓰기
				</a>
			</div>
			<div id="category-tabs" class="category-tabs"></div>
			<div id="post-list"></div>
			<div id="pagination" class="pagination"></div>
		</div>
	</div>

	<script>
		var REPO = 'meonmu437/meonmu437.github.io';
		// 이 레포는 공개 저장소라 원칙적으로는 누구나 새 Discussion을 만들 수
		// 있다. 목록에는 소유자 계정이 쓴 글만 보여줘서 낯선 사람이 올린 글이
		// 섞여 보이는 일을 막는다.
		var OWNER_LOGIN = 'meonmu437';
		// GitHub Discussions의 실제 "핀" 상태는 GraphQL로만 조회 가능하고 GraphQL은
		// 토큰 인증이 필요해서, 정적 페이지에서 안전하게 가져올 방법이 없다. 대신
		// 여기 번호만 적어두면 그 글이 목록 맨 위에 고정된다. discussion 번호는
		// 글 URL(.../discussions/번호) 또는 "+ 새 글 쓰기"로 만든 뒤 주소창에서 확인.
		var PINNED_IDS = [6, 12];

		function escapeHtml(s) {
			var d = document.createElement('div');
			d.textContent = s;
			return d.innerHTML;
		}

		function formatDate(iso) {
			var d = new Date(iso);
			return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
		}

		// GitHub API가 카테고리 이모지를 콜론 코드(예: ":camera:")로 주기 때문에
		// 화면에 실제 이모지로 보이도록 알려진 코드만 직접 변환한다.
		var EMOJI_SHORTCODE_MAP = {
			':camera:': '📷',
			':computer:': '💻',
			':mega:': '📣',
			':speech_balloon:': '💬',
			':star:': '⭐',
			':pray:': '🙏',
			':ballot_box:': '🗳️'
		};

		function categoryEmoji(shortcode) {
			return EMOJI_SHORTCODE_MAP[shortcode] || '';
		}

		var activeCategorySlug = null; // null = 전체
		var currentPage = 1;
		var PAGE_SIZE = 5;

		function renderTabs(categories) {
			var tabsEl = document.getElementById('category-tabs');
			var allTab =
				'<button type="button" class="category-tab' +
				(activeCategorySlug === null ? ' is-active' : '') +
				'" data-slug="">전체</button>';

			var categoryTabs = categories
				.map(function (c) {
					return (
						'<button type="button" class="category-tab' +
						(activeCategorySlug === c.slug ? ' is-active' : '') +
						'" data-slug="' +
						escapeHtml(c.slug) +
						'">' +
						categoryEmoji(c.emoji) +
						' ' +
						escapeHtml(c.name) +
						'</button>'
					);
				})
				.join('');

			tabsEl.innerHTML = allTab + categoryTabs;

			tabsEl.querySelectorAll('.category-tab').forEach(function (btn) {
				btn.addEventListener('click', function () {
					activeCategorySlug = btn.dataset.slug || null;
					currentPage = 1;
					renderTabs(categories);
					renderList();
					updateNewPostLink(categories);
				});
			});
		}

		function updateNewPostLink(categories) {
			var link = document.getElementById('new-post-link');
			var slug = activeCategorySlug;
			if (!slug) {
				var jamdamCategory = categories.find(function (c) {
					return c.slug === '잡담';
				});
				slug = jamdamCategory ? jamdamCategory.slug : categories[0] ? categories[0].slug : '잡담';
			}
			link.href =
				'https://github.com/meonmu437/meonmu437.github.io/discussions/new?category=' + encodeURIComponent(slug);
		}

		var allPosts = [];

		function renderList() {
			var listEl = document.getElementById('post-list');
			var paginationEl = document.getElementById('pagination');
			var posts = activeCategorySlug
				? allPosts.filter(function (p) {
						return p.category.slug === activeCategorySlug;
				  })
				: allPosts;

			if (posts.length === 0) {
				listEl.innerHTML = '<p class="state-msg">이 카테고리에는 아직 글이 없어요.</p>';
				paginationEl.innerHTML = '';
				return;
			}

			var totalPages = Math.max(1, Math.ceil(posts.length / PAGE_SIZE));
			if (currentPage > totalPages) currentPage = totalPages;
			var start = (currentPage - 1) * PAGE_SIZE;
			var pagePosts = posts.slice(start, start + PAGE_SIZE);

			listEl.innerHTML = pagePosts
				.map(function (p) {
					var isPinned = PINNED_IDS.indexOf(p.number) !== -1;
					return (
						'<a class="post-row' +
						(isPinned ? ' is-pinned' : '') +
						'" href="post.html?id=' +
						p.number +
						'">' +
						'<span class="post-category-sticker" aria-hidden="true">' +
						(categoryEmoji(p.category.emoji) || '📌') +
						'</span>' +
						'<span class="post-title">' +
						(isPinned ? '<span class="pin-icon" aria-label="고정된 글">📌</span>' : '') +
						escapeHtml(p.title) +
						'</span>' +
						'<span class="post-meta">' +
						formatDate(p.created_at) +
						' · 댓글 ' +
						p.comments +
						'개</span>' +
						'</a>'
					);
				})
				.join('');

			renderPagination(totalPages);
		}

		function renderPagination(totalPages) {
			var paginationEl = document.getElementById('pagination');
			if (totalPages <= 1) {
				paginationEl.innerHTML = '';
				return;
			}

			paginationEl.innerHTML =
				'<button type="button" class="page-btn" id="page-prev"' +
				(currentPage === 1 ? ' disabled' : '') +
				'>‹ 이전</button>' +
				'<span class="page-status">' +
				currentPage +
				' / ' +
				totalPages +
				'</span>' +
				'<button type="button" class="page-btn" id="page-next"' +
				(currentPage === totalPages ? ' disabled' : '') +
				'>다음 ›</button>';

			var prevBtn = document.getElementById('page-prev');
			var nextBtn = document.getElementById('page-next');
			if (prevBtn) {
				prevBtn.addEventListener('click', function () {
					if (currentPage > 1) {
						currentPage -= 1;
						renderList();
						document.getElementById('post-list').scrollIntoView({ block: 'start' });
					}
				});
			}
			if (nextBtn) {
				nextBtn.addEventListener('click', function () {
					if (currentPage < totalPages) {
						currentPage += 1;
						renderList();
						document.getElementById('post-list').scrollIntoView({ block: 'start' });
					}
				});
			}
		}

		async function loadPosts() {
			var listEl = document.getElementById('post-list');
			listEl.innerHTML = '<p class="state-msg">불러오는 중...</p>';
			try {
				var res = await fetch('https://api.github.com/repos/' + REPO + '/discussions?per_page=100');
				if (!res.ok) throw new Error('HTTP ' + res.status);
				var posts = await res.json();
				posts = posts.filter(function (p) {
					return p.user && p.user.login === OWNER_LOGIN;
				});
				posts.sort(function (a, b) {
					var aPinned = PINNED_IDS.indexOf(a.number) !== -1;
					var bPinned = PINNED_IDS.indexOf(b.number) !== -1;
					if (aPinned !== bPinned) return aPinned ? -1 : 1;
					return new Date(b.created_at) - new Date(a.created_at);
				});

				if (posts.length === 0) {
					listEl.innerHTML = '<p class="state-msg">아직 글이 없어요. "+ 새 글 쓰기"로 첫 글을 남겨보세요.</p>';
					return;
				}

				allPosts = posts;

				var categoryMap = {};
				posts.forEach(function (p) {
					if (!p.category) return;
					var slug = p.category.slug;
					if (!categoryMap[slug]) {
						categoryMap[slug] = { slug: slug, name: p.category.name, emoji: p.category.emoji, count: 0 };
					}
					categoryMap[slug].count += 1;
				});
				var categories = Object.values(categoryMap).sort(function (a, b) {
					return b.count - a.count || a.name.localeCompare(b.name);
				});

				renderTabs(categories);
				renderList();
				updateNewPostLink(categories);
			} catch (e) {
				listEl.innerHTML = '<p class="state-msg">목록을 불러오지 못했어요: ' + escapeHtml(e.message) + '</p>';
			}
		}

		loadPosts();
	</script>
</body>
</html>
