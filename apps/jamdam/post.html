<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>잡담 — meonmu437</title>
<style>
	:root {
		--bg: #0b0d10;
		--window: #12151a;
		--titlebar: #1a1e24;
		--border: #262b33;
		--text: #d7dae0;
		--muted: #7d8590;
		--user: #5fd76d;
		--path: #5b9dfa;
		--dot-red: #ff5f57;
		--dot-yellow: #febc2e;
		--dot-green: #28c840;
	}

	@media (prefers-color-scheme: light) {
		:root {
			--bg: #eef0f3;
			--window: #ffffff;
			--titlebar: #f6f8fa;
			--border: #d8dce2;
			--text: #24292f;
			--muted: #6e7781;
			--user: #1a7f37;
			--path: #0969da;
		}
	}

	* {
		box-sizing: border-box;
	}

	html,
	body {
		margin: 0;
		padding: 0;
	}

	body {
		min-height: 100vh;
		background: var(--bg);
		padding: 2rem 1.25rem 4rem;
		font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
		display: flex;
		justify-content: center;
	}

	.terminal {
		width: 100%;
		max-width: 40rem;
		border-radius: 0.75rem;
		border: 1px solid var(--border);
		background: var(--window);
		box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.35);
		overflow: hidden;
	}

	.titlebar {
		display: flex;
		align-items: center;
		gap: 0.6rem;
		padding: 0.65rem 0.9rem;
		background: var(--titlebar);
		border-bottom: 1px solid var(--border);
	}

	.dots {
		display: flex;
		gap: 0.45rem;
	}

	.dot {
		width: 0.7rem;
		height: 0.7rem;
		border-radius: 50%;
	}

	.dot.red {
		background: var(--dot-red);
	}
	.dot.yellow {
		background: var(--dot-yellow);
	}
	.dot.green {
		background: var(--dot-green);
	}

	.titlebar-label {
		flex: 1;
		text-align: center;
		font-size: 0.78rem;
		color: var(--muted);
		margin-inline-end: 2.5rem;
	}

	.screen {
		padding: 1.5rem 1.25rem 2rem;
		font-size: 0.9rem;
		line-height: 1.7;
		color: var(--text);
	}

	.line {
		word-break: break-word;
	}

	.prompt .user {
		color: var(--user);
		font-weight: 600;
	}

	.prompt .sep {
		color: var(--muted);
	}

	.prompt .path {
		color: var(--path);
		font-weight: 600;
	}

	.prompt-path-link {
		text-decoration: none;
		cursor: pointer;
	}

	.prompt-path-link:hover .path {
		text-decoration: underline;
	}

	.back-link {
		display: inline-flex;
		align-items: center;
		gap: 0.35rem;
		margin-top: 1.1rem;
		color: var(--muted);
		text-decoration: none;
		font-size: 0.82rem;
	}

	.back-link:hover {
		color: var(--path);
	}

	.back-link--bottom {
		margin-top: 2rem;
		padding-top: 1.25rem;
		border-top: 1px dashed var(--border);
	}

	.post-title {
		margin: 1.3rem 0 0.2rem;
		font-size: 1.15rem;
	}

	.post-meta {
		font-size: 0.78rem;
		color: var(--muted);
	}

	.post-body {
		margin-top: 1rem;
		padding-top: 1rem;
		border-top: 1px dashed var(--border);
	}

	.post-body img {
		max-width: 100%;
		border-radius: 0.4rem;
	}

	.post-body pre {
		overflow-x: auto;
		padding: 0.75rem;
		background: color-mix(in srgb, var(--titlebar) 80%, transparent);
		border-radius: 0.4rem;
	}

	.state-msg {
		margin-top: 1.4rem;
		color: var(--muted);
		font-size: 0.85rem;
	}

	.anon-reactions {
		margin-top: 1.4rem;
		padding-top: 1.1rem;
		border-top: 1px dashed var(--border);
	}

	.anon-reactions-row {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
	}

	.anon-reaction-btn {
		display: inline-flex;
		align-items: center;
		gap: 0.35rem;
		padding: 0.3rem 0.6rem;
		border-radius: 999px;
		border: 1px solid var(--border);
		background: color-mix(in srgb, var(--titlebar) 70%, transparent);
		color: var(--text);
		font-family: inherit;
		font-size: 0.85rem;
		cursor: pointer;
	}

	.anon-reaction-btn:hover {
		border-color: var(--path);
	}

	.anon-reaction-btn.reacted {
		border-color: var(--path);
		background: color-mix(in srgb, var(--path) 18%, transparent);
	}

	.anon-reaction-btn:disabled {
		cursor: default;
		opacity: 0.85;
	}

	.anon-reaction-count {
		font-size: 0.78rem;
		color: var(--muted);
		min-width: 0.9rem;
		text-align: left;
	}

	#giscus-mount {
		margin-top: 1.75rem;
	}
</style>
</head>
<body>
	<div class="terminal">
		<div class="titlebar">
			<div class="dots">
				<span class="dot red"></span>
				<span class="dot yellow"></span>
				<span class="dot green"></span>
			</div>
			<div class="titlebar-label">guest@meonmu437: ~/worlds/잡담</div>
		</div>
		<div class="screen">
			<div class="line prompt">
				<a href="index.html" class="prompt-path-link"><span class="user">guest@meonmu437</span><span class="sep">:</span><span class="path">~/worlds/잡담</span></a><span class="sep">$</span>
				<span id="post-command"></span>
			</div>

			<div id="post-mount">
				<p class="state-msg">불러오는 중...</p>
			</div>

			<div id="anon-reactions"></div>

			<div id="giscus-mount"></div>

			<a href="index.html" class="back-link back-link--bottom">&larr; 목록으로 돌아가기</a>
		</div>
	</div>

	<script>
		var REPO = 'meonmu437/meonmu437.github.io';
		var REPO_ID = 'R_kgDOTsJbQQ';
		var CATEGORY = '잡담';
		var CATEGORY_ID = 'DIC_kwDOTsJbQc4DC8KA';

		function escapeHtml(s) {
			var d = document.createElement('div');
			d.textContent = s;
			return d.innerHTML;
		}

		function formatDate(iso) {
			var d = new Date(iso);
			return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
		}

		// 로그인 없이 누구나 누를 수 있는 반응. GitHub 리액션(로그인 필요)과는
		// 별개로, 익명 카운터 서비스(abacus)에 이모지별로 숫자만 센다.
		// 어뷰징(같은 사람이 여러 번 누르는 것)을 완전히 막을 수는 없어서,
		// 이 브라우저에서 이미 누른 이모지는 localStorage로 기억해 한 번만
		// 누르게 하는 정도로만 막는다.
		var COUNTER_NAMESPACE = 'jamdam-meonmu437';
		var REACTIONS = [
			{ key: 'heart', emoji: '❤️' },
			{ key: 'fire', emoji: '🔥' },
			{ key: 'party', emoji: '🎉' },
			{ key: 'star', emoji: '⭐' },
			{ key: 'rocket', emoji: '🚀' },
			{ key: 'eyes', emoji: '👀' },
			{ key: 'cat', emoji: '🐱' },
			{ key: 'dog', emoji: '🐶' },
		];

		function reactedStorageKey(postId, reactionKey) {
			return 'jamdam-reacted-' + postId + '-' + reactionKey;
		}

		async function fetchCount(postId, reactionKey) {
			var url = 'https://abacus.jasoncameron.dev/get/' + COUNTER_NAMESPACE + '/' + postId + '-' + reactionKey;
			var res = await fetch(url);
			// 아직 한 번도 반응이 없었던 키는 404("Key not found")를 준다 —
			// 진짜 오류가 아니라 카운트 0으로 취급한다.
			if (res.status === 404) return 0;
			if (!res.ok) throw new Error('HTTP ' + res.status);
			var data = await res.json();
			return data.value || 0;
		}

		async function hitCount(postId, reactionKey) {
			var url = 'https://abacus.jasoncameron.dev/hit/' + COUNTER_NAMESPACE + '/' + postId + '-' + reactionKey;
			var res = await fetch(url);
			if (!res.ok) throw new Error('HTTP ' + res.status);
			var data = await res.json();
			return data.value || 0;
		}

		function renderAnonReactions(postId) {
			var mount = document.getElementById('anon-reactions');
			mount.innerHTML =
				'<div class="anon-reactions-row">' +
				REACTIONS.map(function (r) {
					return (
						'<button type="button" class="anon-reaction-btn" data-key="' +
						r.key +
						'"><span>' +
						r.emoji +
						'</span><span class="anon-reaction-count" data-count-for="' +
						r.key +
						'">&middot;&middot;&middot;</span></button>'
					);
				}).join('') +
				'</div>';

			REACTIONS.forEach(function (r) {
				var alreadyReacted = !!localStorage.getItem(reactedStorageKey(postId, r.key));
				var btn = mount.querySelector('.anon-reaction-btn[data-key="' + r.key + '"]');
				var countEl = mount.querySelector('.anon-reaction-count[data-count-for="' + r.key + '"]');

				if (alreadyReacted) {
					btn.classList.add('reacted');
					btn.disabled = true;
				}

				fetchCount(postId, r.key)
					.then(function (count) {
						countEl.textContent = count;
					})
					.catch(function () {
						countEl.textContent = '-';
					});

				btn.addEventListener('click', function () {
					btn.disabled = true;
					hitCount(postId, r.key)
						.then(function (count) {
							countEl.textContent = count;
							btn.classList.add('reacted');
							localStorage.setItem(reactedStorageKey(postId, r.key), '1');
						})
						.catch(function () {
							btn.disabled = false;
						});
				});
			});
		}

		function mountGiscus(discussionNumber) {
			var script = document.createElement('script');
			script.src = 'https://giscus.app/client.js';
			script.setAttribute('data-repo', REPO);
			script.setAttribute('data-repo-id', REPO_ID);
			script.setAttribute('data-category', CATEGORY);
			script.setAttribute('data-category-id', CATEGORY_ID);
			script.setAttribute('data-mapping', 'number');
			script.setAttribute('data-term', String(discussionNumber));
			script.setAttribute('data-strict', '0');
			script.setAttribute('data-reactions-enabled', '0');
			script.setAttribute('data-emit-metadata', '0');
			script.setAttribute('data-input-position', 'top');
			script.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			script.setAttribute('data-lang', 'ko');
			script.crossOrigin = 'anonymous';
			script.async = true;
			document.getElementById('giscus-mount').appendChild(script);
		}

		async function loadPost() {
			var id = new URLSearchParams(location.search).get('id');
			var mount = document.getElementById('post-mount');

			if (!id) {
				mount.innerHTML = '<p class="state-msg">글 번호가 없어요. 목록에서 다시 눌러주세요.</p>';
				return;
			}

			document.getElementById('post-command').textContent = 'cat ' + id;

			try {
				var res = await fetch('https://api.github.com/repos/' + REPO + '/discussions/' + id, {
					headers: { Accept: 'application/vnd.github.html+json' },
				});
				if (!res.ok) throw new Error('HTTP ' + res.status);
				var post = await res.json();

				document.title = post.title + ' — 잡담';
				mount.innerHTML =
					'<h1 class="post-title">' +
					escapeHtml(post.title) +
					'</h1>' +
					'<p class="post-meta">' +
					formatDate(post.created_at) +
					'</p>' +
					'<div class="post-body">' +
					(post.body_html || '<p>(내용 없음)</p>') +
					'</div>';

				renderAnonReactions(post.number);
				mountGiscus(post.number);
			} catch (e) {
				mount.innerHTML = '<p class="state-msg">글을 불러오지 못했어요: ' + escapeHtml(e.message) + '</p>';
			}
		}

		loadPost();
	</script>
</body>
</html>
