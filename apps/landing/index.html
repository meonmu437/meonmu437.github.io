<style>
	@font-face {
		font-family: 'SSRONET Handwritten';
		src: url('https://cdn.jsdelivr.net/gh/sweetherofonts/fontshero_pack4/ssronethandwritten/ssronethandwritten-Regular.woff2') format('woff2');
		font-weight: 400;
		font-style: normal;
		font-display: swap;
	}

	:root {
		--paper: #fbf4e6;
		--dot: rgba(120, 100, 70, 0.16);
		--ink: #3a3128;
		--muted: #8a7b64;
		--card: #fffdf7;
		--card-border: #e7d9bd;
		--shadow: rgba(90, 70, 30, 0.18);
		--pin: #d94f6b;
	}

	* {
		box-sizing: border-box;
	}

	html,
	body {
		margin: 0;
		padding: 0;
	}

	body {
		min-height: 100vh;
		background-color: var(--paper);
		background-image: radial-gradient(var(--dot) 1.3px, transparent 1.3px);
		background-size: 18px 18px;
		color: var(--ink);
		font-family: 'Noto Sans KR', sans-serif;
		padding: clamp(2.5rem, 8vw, 4.5rem) 1.25rem clamp(3.5rem, 8vw, 5rem);
	}

	.diary {
		max-width: 40rem;
		margin: 0 auto;
	}

	/* ── 표지: 워시테이프로 고정한 제목 ── */
	.masthead {
		position: relative;
		text-align: center;
		margin-bottom: clamp(2.2rem, 6vw, 3rem);
	}

	.masthead-tape {
		position: absolute;
		top: -0.9rem;
		left: 50%;
		width: 8rem;
		height: 1.6rem;
		transform: translateX(-50%) rotate(-2deg);
		background: repeating-linear-gradient(45deg, #f2c9d6 0 8px, #f7dbe4 8px 16px);
		opacity: 0.88;
		box-shadow: 0 2px 3px var(--shadow);
	}

	.masthead h1 {
		margin: 1.3rem 0 0;
		font-family: 'SSRONET Handwritten', 'Noto Sans KR', sans-serif;
		font-weight: 400;
		font-size: clamp(2.1rem, 7vw, 3rem);
		color: var(--ink);
		transform: rotate(-1deg);
	}

	.masthead .doodle {
		position: absolute;
		z-index: 2;
		font-size: 1.45rem;
		opacity: 1;
		filter:
			drop-shadow(-2px 0 #fffaf0) drop-shadow(2px 0 #fffaf0)
			drop-shadow(0 -2px #fffaf0) drop-shadow(0 2px #fffaf0)
			drop-shadow(1px 2px 1px rgba(76,54,35,.24));
	}
	.masthead .doodle--star {
		top: -1.6rem;
		left: 14%;
		transform: rotate(-12deg);
	}
	.masthead .doodle--heart {
		top: 0.2rem;
		right: 12%;
		transform: rotate(10deg);
	}

	.masthead .subtitle {
		margin: 0.65rem 0 0;
		font-family: 'SSRONET Handwritten', 'Noto Sans KR', sans-serif;
		font-size: 1.05rem;
		color: var(--muted);
	}

	/* ── 책 전체: 책갈피 리본이 꽂힐 기준 좌표 ── */
	.book {
		position: relative;
	}

	/* ── 잡담: 말풍선 모양 레트로 스티커 (흰 테두리 + 진한 아웃라인의
	   "다이어리 스티커북" 재질). SVG path를 halo(두꺼운 흰 선) → outline
	   (진한 선 + 채우기) 순서로 두 번 그려서 스티커 특유의 컷팅 라인을
	   흉내 낸다. ── */
	.chat-sticker {
		position: absolute;
		top: -1.15rem;
		right: clamp(0.4rem, 6vw, 2rem);
		z-index: 3;
		display: block;
		width: 6.8rem;
		height: 4.15rem;
		transform: rotate(-6deg);
		filter: drop-shadow(2px 3px 1px var(--shadow));
		transition: transform 0.15s ease;
	}
	.chat-sticker:hover,
	.chat-sticker:focus-visible {
		transform: rotate(-2deg) translateY(-3px) scale(1.03);
	}
	.chat-sticker svg {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		overflow: visible;
	}
	.sticker-halo {
		fill: none;
		stroke: #fffaf0;
		stroke-width: 12;
		stroke-linejoin: round;
		stroke-linecap: round;
	}
	.sticker-outline {
		fill: url(#bubble-dots);
		stroke: #568da5;
		stroke-width: 3;
		stroke-linejoin: round;
	}
	.chat-sticker-text {
		position: absolute;
		top: 0;
		bottom: 1rem;
		left: 0;
		right: 0;
		height: auto;
		display: grid;
		place-items: center;
		padding-left: .12rem;
		font-family: 'SSRONET Handwritten', 'Noto Sans KR', sans-serif;
		font-size: 1.35rem;
		line-height: 1;
		text-align: center;
		color: #31677d;
		text-shadow: 0 1px 0 rgba(255,255,255,.7);
		transform: translateY(.22rem);
		pointer-events: none;
	}

	/* ── 인덱스 탭: 다이어리 위쪽에서 오가는 섹션 탭 ── */
	.index-tabs {
		display: flex;
		gap: 0.35rem;
		padding-left: 0.5rem;
	}

	.tab {
		appearance: none;
		border: 2px solid var(--card-border);
		border-bottom: none;
		background: var(--card);
		border-radius: 0.8rem 0.8rem 0 0;
		padding: 0.75rem 1rem 0.55rem;
		font-family: 'SSRONET Handwritten', 'Noto Sans KR', sans-serif;
		font-weight: 400;
		font-size: 0.88rem;
		color: var(--muted);
		cursor: pointer;
		opacity: 0.72;
		transform: translateY(5px);
		transition: transform 0.15s ease, opacity 0.15s ease;
	}

	.tab::before {
		content: '';
		display: block;
		height: 0.32rem;
		margin: -0.75rem -1rem 0.5rem;
		border-radius: 0.8rem 0.8rem 0 0;
		background: var(--tape);
		opacity: 0.9;
	}

	.tab.active {
		color: var(--ink);
		opacity: 1;
		transform: translateY(0);
	}

	.tab:hover {
		opacity: 0.9;
	}

	/* ── 펼쳐진 페이지: 활성 탭에 붙은 내용 ── */
	.page {
		border: 2px solid var(--card-border);
		border-radius: 0 0.9rem 0.9rem 0.9rem;
		background: var(--card);
		padding: clamp(1.4rem, 4vw, 1.9rem) clamp(1.1rem, 4vw, 1.6rem);
	}

	/* ── 노트에 손으로 적은 목록: 포스트잇 상자 대신, 노트 위에 바로 쓴
	   제목 + 소개글 한 줄에 이모지 스티커(아웃라인 있는 진짜 스티커
	   모양)만 옆에 붙여 둔다. ── */
	.entry-list {
		display: flex;
		flex-direction: column;
		gap: 1.1rem;
	}

	.diary-entry {
		display: flex;
		align-items: center;
		gap: 0.75rem;
		text-decoration: none;
		color: inherit;
	}

	.entry-sticker {
		flex-shrink: 0;
		position: relative;
		width: 2.3rem;
		height: 2.3rem;
		transform: rotate(var(--tilt, -6deg));
		filter: drop-shadow(1.5px 2.5px 0 var(--shadow));
		transition: transform 0.15s ease;
	}
	.diary-entry:nth-child(3n + 1) .entry-sticker {
		--tilt: -8deg;
	}
	.diary-entry:nth-child(3n + 2) .entry-sticker {
		--tilt: 6deg;
	}
	.diary-entry:nth-child(3n) .entry-sticker {
		--tilt: -3deg;
	}
	.diary-entry:hover .entry-sticker,
	.diary-entry:focus-visible .entry-sticker {
		transform: rotate(0deg) scale(1.08);
	}

	.entry-sticker svg {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		overflow: visible;
	}
	.entry-sticker-halo {
		fill: none;
		stroke: var(--paper);
		stroke-width: 9;
	}
	.entry-sticker-outline {
		stroke: var(--ink);
		stroke-width: 3.5;
	}
	.entry-sticker-emoji {
		position: absolute;
		inset: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 1.15rem;
		pointer-events: none;
	}

	.entry-text {
		min-width: 0;
	}

	.entry-title {
		display: block;
		font-family: 'SSRONET Handwritten', 'Noto Sans KR', sans-serif;
		font-weight: 400;
		font-size: 1.3rem;
		color: var(--ink);
		text-decoration: underline;
		text-decoration-color: var(--card-border);
		text-underline-offset: 0.2rem;
	}

	.entry-desc {
		display: block;
		margin-top: 0.1rem;
		font-family: 'SSRONET Handwritten', 'Noto Sans KR', sans-serif;
		font-size: 1.02rem;
		line-height: 1.35;
		color: var(--muted);
	}

	@media (prefers-reduced-motion: reduce) {
		.tab,
		.entry-sticker,
		.chat-sticker {
			transition: none;
		}
	}

	@media (max-width: 24rem) {
		.index-tabs {
			gap: 0.2rem;
		}
		.tab {
			padding: 0.65rem 0.6rem 0.5rem;
			font-size: 0.78rem;
		}

	@media (max-width: 38rem) {
		.vinyl-cover { padding-inline: 1.15rem 2.8rem; }
		.book { margin-left: .45rem; margin-right: 0; }
		.index-tabs { right: -2.85rem; }
		.tab { width: 2.9rem; font-size: .65rem; }
		.cover-sticker--flower { top: 4.8rem; right: .25rem; font-size: 1.65rem; }
		.cover-sticker--label { right: .5rem; }
	}
	@media (max-width: 27rem) {
		body { padding-inline: .65rem; }
		.vinyl-cover { padding: 1rem 2.45rem 1.25rem .95rem; border-radius: 1.15rem .7rem .7rem 1.15rem; }
		.masthead { width: 92%; padding-inline: .55rem; }
		.masthead h1 { font-size: 2rem; }
		.masthead .subtitle { font-size: .76rem; white-space: nowrap; }
		.cover-sticker--smile { top: .7rem; left: .45rem; font-size: 1.45rem; }
		.cover-sticker--label { display: none; }
		.page { padding: 2rem .85rem 1.6rem 2rem; }
		.page-heading { align-items: flex-start; flex-direction: column; gap: .25rem; }
		.ring-spine { left: -1rem; }
		.ring-spine i { width: 1.85rem; }
	}
</style>
</head>
<body>
	<main class="diary">
		<div class="vinyl-cover">
			<span class="cover-sticker cover-sticker--smile" aria-hidden="true">🐶</span>
			<span class="cover-sticker cover-sticker--flower" aria-hidden="true">👾</span>
			<span class="cover-sticker cover-sticker--label" aria-hidden="true">이 다이어리의 주인<br><b>MEONMU437</b></span>

			<header class="masthead">
				<span class="doodle doodle--star" aria-hidden="true">🐾</span>
				<span class="doodle doodle--heart" aria-hidden="true">💖</span>
				<span class="masthead-tape" aria-hidden="true"></span>
				<p class="masthead-date">WORLD DIARY · VOL. 01</p>
				<h1>어딘가의 세계들</h1>
				<p class="subtitle">여기저기 꾸며 둔 세계와 그 안의 사람들</p>
			</header>

			<div class="book">
				<div class="ring-spine" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
				<a class="chat-sticker" href="jamdam/" aria-label="잡담 하러 가기">
					<svg viewBox="0 0 120 64" aria-hidden="true">
						<defs>
							<pattern id="bubble-dots" width="10" height="10" patternUnits="userSpaceOnUse">
								<rect width="10" height="10" fill="#ccecf4" />
								<circle cx="2" cy="2" r="1.2" fill="#8ccbdc" opacity=".72" />
							</pattern>
							<path id="bubble-shape" d="M24,7 C16,7 10,12 10,19 C4,22 4,31 10,35 C8,42 15,48 24,47 L21,59 L38,48 H96 C107,48 114,41 112,33 C117,27 114,18 106,15 C103,7 92,5 85,9 C77,4 65,5 59,10 C49,5 37,6 31,10 C29,8 27,7 24,7 Z" />
						</defs>
						<use href="#bubble-shape" class="sticker-halo" />
						<use href="#bubble-shape" class="sticker-outline" />
					</svg>
					<span class="chat-sticker-text" aria-hidden="true">잡담</span>
				</a>
				<span class="paper-stack" aria-hidden="true"></span>
				<nav class="index-tabs" id="tabs" aria-label="세계관 인덱스"></nav>
				<div class="page" id="page"></div>
			</div>
		</div>
	</main>

	<script>
		// 새 세계관을 추가할 때는 이 배열에만 항목을 추가하면 된다.
		// tape / doodle은 각 그룹의 워시테이프·스티커 색과 아이콘.
		var GROUPS = [
			{
				name: '어딘가의 이야기',
				tab: '이야기',
				tape: '#c9b8e8',
				items: [
					{ name: '컬러그라운드', href: 'colorground/', desc: '레인보우 빌리지를 지키는 컬러 히어로와 자율 로봇들의 이야기', emoji: '🌈' },
					{ name: '나이트하이웨이', href: 'nighthighway/', desc: '재앙 이후 아날로그 기술만이 살아남은 밤의 고속도로 생존기', emoji: '🏍️' },
					{ name: '아네모이', href: 'anemoi/', desc: '네 바람이 한곳에 모이는 땅, 아네모이 제국의 로맨스 판타지', emoji: '🍃' },
				],
			},
			{
				name: '어딘가의 대한민국',
				tab: '대한민국',
				tape: '#a8dcc7',
				items: [
					{ name: '윤해시', href: 'yunhaesi/', desc: '바닷바람에서 소금 냄새가 나는 작은 항구도시', emoji: '🌊🌟' },
					{ name: '유승민', href: 'seungmin/', desc: '무심한듯 다정한 백엔드 프로그래머', emoji: '💻' },
					{ name: '1997', href: '1997/', desc: '1997년, 첫사랑은 되감기 중', emoji: '📟' },
					{ name: '2004', href: '2004/', desc: '7년째, 짝사랑은 재생 중', emoji: '💿' },
					{ name: '한민우', href: 'hanminwoo/', desc: '장마와 푸른 베타', emoji: '☔️' },
				],
			},
			{
				name: '어딘가의 지구',
				tab: '지구',
				tape: '#f5c2a0',
				items: [
					{ name: '줄리안', href: 'julian/', desc: '완벽한 위장 신분, 완벽하지 않은 진심', emoji: '🕶️' },
				],
			},
		];

		var activeIndex = 0;

		function renderPage() {
			var page = document.getElementById('page');
			var group = GROUPS[activeIndex];
			page.style.setProperty('--page-accent', group.tape);
			var heading = document.createElement('div');
			heading.className = 'page-heading';
			heading.innerHTML = '<h2>' + group.name + '</h2><span>' + (activeIndex + 1) + '번째 인덱스 · ' + group.items.length + '개의 기록</span>';
			var list = document.createElement('div');
			list.className = 'entry-list';
			group.items.forEach(function (item) {
				var a = document.createElement('a');
				a.className = 'diary-entry';
				a.href = item.href;
				a.style.setProperty('--tape', group.tape);
				a.innerHTML =
					'<span class="entry-sticker" aria-hidden="true">' +
					'<span class="entry-sticker-emoji">' + item.emoji + '</span>' +
					'</span>' +
					'<span class="entry-text">' +
					'<span class="entry-title">' + item.name + '</span>' +
					'<span class="entry-desc">' + item.desc + '</span>' +
					'</span>';
				list.appendChild(a);
			});
			page.innerHTML = '';
			page.appendChild(heading);
			page.appendChild(list);
		}

		function renderTabs() {
			var tabs = document.getElementById('tabs');
			tabs.innerHTML = '';
			GROUPS.forEach(function (group, i) {
				var btn = document.createElement('button');
				btn.type = 'button';
				btn.className = 'tab' + (i === activeIndex ? ' active' : '');
				btn.style.setProperty('--tape', group.tape);
				btn.textContent = group.tab || group.name;
				btn.title = group.name;
				btn.setAttribute('aria-selected', i === activeIndex ? 'true' : 'false');
				btn.addEventListener('click', function () {
					if (activeIndex === i) return;
					activeIndex = i;
					renderTabs();
					renderPage();
				});
				tabs.appendChild(btn);
			});
		}

		renderTabs();
		renderPage();
	</script>
</body>
</html>
