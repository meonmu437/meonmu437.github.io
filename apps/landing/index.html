  'nighthighway/': ['생존 야식','assorted'],
  'anemoi/': ['황실 만찬','assorted'],
  'yunhaesi/': ['사연 한 상','assorted']
};
GROUPS.forEach(function(group,index) {
  var section = document.createElement('section');
  section.className = 'menu-category flavor-' + index;
  var summary = document.createElement('header');
  summary.className = 'flavor-header';
  summary.innerHTML = '<span class="category-number">0' + (index+1) + '</span><div class="flavor-heading"><h3 class="flavor-name" id="flavor-' + index + '">' + group.name + '</h3><span class="flavor-note">' + group.note + '</span></div><span class="flavor-badge">' + group.badge + '</span>';
  section.setAttribute('aria-labelledby','flavor-' + index);
  section.appendChild(summary);
  var items = document.createElement('div');
  items.className = 'menu-items';
  group.items.forEach(function(item) {
    var link = document.createElement('a');
    link.className = 'menu-item';
    link.href = item.href;
    var taste = item.href === 'hanminwoo/' ? null : (TASTES[item.href] || ['골라먹기','assorted']);
    var tasteLabel = taste ? '<span class="taste-sticker taste-' + taste[1] + '">' + taste[0] + '</span>' : '';
    link.innerHTML = '<span class="item-icon' + (item.href === 'yunhaesi/' ? ' item-icon-pair' : '') + '" aria-hidden="true">' + item.emoji + '</span><span><span class="item-name-row"><span class="item-name">' + item.name + '</span>' + tasteLabel + '</span><span class="item-description">' + item.desc + '</span></span><span class="item-arrow" aria-hidden="true">↗</span>';
    items.appendChild(link);
  });
  section.appendChild(items);
  mount.appendChild(section);
});
</script>
</body>
</html>
