<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>세계관 위키</title>
<style>
	:root {
		--bg: #ffffff;
		--text: #1a1a1a;
		--text-muted: #6b6b76;
		--card-bg: #f7f7f9;
		--card-border: #e7e7ec;
		--accent: #3d7bff;
	}

	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0e0e12;
			--text: #f2f2f5;
			--text-muted: #9a9aa6;
			--card-bg: #17171d;
			--card-border: #26262f;
			--accent: #6fa2ff;
		}
	}

	* {
		box-sizing: border-box;
	}

	html,
	body {
		margin: 0;
		padding: 0;
	}

	body {
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: var(--bg);
		color: var(--text);
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
		padding: 2rem 1.25rem;
	}

	main {
		width: 100%;
		max-width: 32rem;
	}

	.title {
		margin: 0 0 0.5rem;
		font-size: 1.75rem;
		font-weight: 700;
		letter-spacing: -0.02em;
		text-align: center;
	}

	.subtitle {
		margin: 0 0 2.5rem;
		text-align: center;
		font-size: 0.95rem;
		color: var(--text-muted);
	}

	.wiki-list {
		list-style: none;
		margin: 0;
		padding: 0;
		display: flex;
		flex-direction: column;
		gap: 0.75rem;
	}

	.wiki-card {
		display: block;
		padding: 1.1rem 1.25rem;
		border-radius: 0.9rem;
		border: 1px solid var(--card-border);
		background: var(--card-bg);
		text-decoration: none;
		color: var(--text);
		transition: border-color 0.15s ease, transform 0.15s ease;
	}

	.wiki-card:hover {
		border-color: var(--accent);
		transform: translateY(-1px);
	}

	.wiki-name {
		display: block;
		font-size: 1.05rem;
		font-weight: 600;
		margin-bottom: 0.3rem;
	}

	.wiki-desc {
		display: block;
		font-size: 0.85rem;
		color: var(--text-muted);
		line-height: 1.5;
	}

	footer {
		margin-top: 2.5rem;
		text-align: center;
		font-size: 0.8rem;
		color: var(--text-muted);
	}
</style>
</head>
<body>
	<main>
		<h1 class="title">세계관 위키</h1>
		<p class="subtitle">읽고 싶은 세계관을 선택하세요.</p>

		<ul class="wiki-list">
			<li>
				<a class="wiki-card" href="https://meonmu437.github.io/colorground/">
					<span class="wiki-name">컬러그라운드</span>
					<span class="wiki-desc">레인보우 빌리지를 지키는 컬러 히어로와 자율 로봇들의 이야기</span>
				</a>
			</li>
		</ul>

		<footer>더 많은 세계관이 이곳에 추가될 예정입니다.</footer>
	</main>
</body>
</html>
